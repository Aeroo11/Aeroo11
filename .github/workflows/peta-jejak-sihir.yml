name: Peta Jejak Sihir

on:
  schedule:
    - cron: "23 17 * * *"   # setiap hari 00:23 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  gambar-peta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gambar peta dari data kontribusi
        run: python3 scripts/peta_jejak.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Simpan peta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/peta-jejak-sihir.svg
          git diff --cached --quiet || git commit -m "chore: perbarui peta jejak sihir"
          git push
