name: Perbarui grafik kontribusi

on:
  schedule:
    - cron: "23 17 * * *"   # setiap hari 00:23 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  perbarui-grafik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buat grafik dari data kontribusi
        run: python3 scripts/kontribusi.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Simpan grafik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kontribusi.svg
          git diff --cached --quiet || git commit -m "chore: perbarui grafik kontribusi"
          git push
